[package]
name = "agentlog"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "A local browser for AI coding-agent session history"
license = "MIT"
repository = "https://github.com/choplin/agentlog"
homepage = "https://github.com/choplin/agentlog"

[package.metadata.release]
publish = false
tag = true
tag-name = "v{{version}}"
push = true

[package.metadata.dist]
dist = true

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
indicatif = "0.18"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
    "std",
    "unstable-rendered-line-info",
] }
rustix = { version = "1.1", features = ["process", "termios"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tempfile = "3.24"
urushi = "0.1.1"
urushi-adapter-ratatui = "0.1.1"
urushi-cli = "0.1.1"
urushi-prompt = "0.1.1"

[dev-dependencies]
portable-pty = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
